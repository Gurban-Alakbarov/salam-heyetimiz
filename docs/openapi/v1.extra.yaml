        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ===========================================================================
  # Admin / Settings v2 (DB-driven, grouped, encrypted secrets, versioned)
  # ===========================================================================
  /admin/settings:
    get:
      tags: [Admin / Settings]
