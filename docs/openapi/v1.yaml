          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeatureFlag' }

  # ----- Admin Notifications (campaigns) -----------------------------------
  /admin/notifications:
    get:
      tags: [Admin / Notifications]
      summary: List notification campaigns
      operationId: adminListNotificationCampaigns
      security: [{ adminBearerAuth: [] }]
      x-authorization: notifications.view
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - in: query
          name: status
          schema: { type: string, enum: [draft, queued, sending, sent, failed] }
      responses:
        '200':
          description: ok (complex_manager sees only its own complex's campaigns)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationCampaignListResponse' }
    post:
      tags: [Admin / Notifications]
      summary: Create and send a system notification (send now)
      description: >-
        Fan-out to a resident audience as push + inapp (fixed channels; no campaign channels_mask).
        complex_manager is server-scoped to its own complex. Recipients dedupe to distinct user_id.
        Requires confirmed=true and an Idempotency-Key.
      operationId: adminSendNotification
      security: [{ adminBearerAuth: [] }]
      x-authorization: notifications.send
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationCampaignCreate' }
      responses:
        '202':
          description: accepted — fan-out queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationCampaign' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: confirmation required (confirmed=true missing) }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/notifications/audience/preview:
    post:
      tags: [Admin / Notifications]
      summary: Resolve the recipient count for an audience (before confirmation)
      operationId: adminPreviewNotificationAudience
      security: [{ adminBearerAuth: [] }]
      x-authorization: notifications.view
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [audience]
              properties:
                audience: { $ref: '#/components/schemas/AudienceSpec' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AudiencePreview' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/notifications/{campaignId}:
    parameters:
      - in: path
        name: campaignId
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Admin / Notifications]
      summary: Campaign detail + delivery stats
      operationId: adminGetNotificationCampaign
      security: [{ adminBearerAuth: [] }]
      x-authorization: notifications.view
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationCampaign' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----- Admin Notification Templates --------------------------------------
  /admin/notification-templates:
    get:
      tags: [Admin / Notification Templates]
      summary: List templates
      operationId: adminListNotificationTemplates
      security: [{ adminBearerAuth: [] }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/NotificationTemplate' }

  /admin/notification-templates/{key}:
    parameters:
      - in: path
        name: key
        required: true
        schema: { type: string, maxLength: 80 }
    get:
      tags: [Admin / Notification Templates]
      summary: Template detail with all locales
      operationId: adminGetNotificationTemplate
      security: [{ adminBearerAuth: [] }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationTemplateDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Admin / Notification Templates]
      summary: Update template metadata (channels mask, active state)
      operationId: adminUpdateNotificationTemplate
      security: [{ adminBearerAuth: [] }]
      x-authorization: super_admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationTemplateUpdate' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationTemplate' }

  /admin/notification-templates/{key}/locales/{locale}:
    parameters:
      - in: path
        name: key
        required: true
        schema: { type: string, maxLength: 80 }
      - in: path
        name: locale
        required: true
        schema: { type: string, enum: [az, ru, en] }
    put:
      tags: [Admin / Notification Templates]
      summary: Upsert a locale body
      operationId: adminUpsertNotificationTemplateLocale
      security: [{ adminBearerAuth: [] }]
      x-authorization: super_admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                subject: { type: string, maxLength: 160, nullable: true }
                body: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationTemplateLocale' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/notification-templates/{key}/preview:
    parameters:
      - in: path
        name: key
        required: true
        schema: { type: string }
    post:
      tags: [Admin / Notification Templates]
      summary: Render a template with sample variables
      operationId: adminPreviewNotificationTemplate
      security: [{ adminBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locale, variables]
              properties:
                locale: { type: string, enum: [az, ru, en] }
                variables: { type: object, additionalProperties: true }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  subject: { type: string, nullable: true }
                  body: { type: string }

# =============================================================================
# COMPONENTS
# =============================================================================
components:

  # ---------------------------------------------------------------------------
  # Security Schemes
  # ---------------------------------------------------------------------------
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Mobile JWT issued by `/auth/otp/verify` or `/auth/refresh`.
        Algorithm RS256, 15-minute TTL. Subject is `user.{id}`.
    adminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Admin JWT issued by `/admin/v1/auth/2fa/verify`. Disjoint identity space
        from `bearerAuth`. Algorithm RS256, 30-minute TTL.
    bankCallbackSignature:
      type: apiKey
      in: header
      name: X-Kapital-Signature
      description: |
        HMAC-SHA256 hex digest of the canonical request body using the shared
        secret negotiated with Kapital Bank. Verified before any state mutation.
    smsProviderSignature:
      type: apiKey
      in: header
      name: X-Sms-Signature
      description: HMAC signature from the inbound SMS provider.

  # ---------------------------------------------------------------------------
  # Reusable Parameters
  # ---------------------------------------------------------------------------
  parameters:
    DeviceId:
      in: path
      name: deviceId
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    SubscriptionId:
      in: path
      name: subscriptionId
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    OrderId:
      in: path
      name: orderId
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    Limit:
      in: query
      name: limit
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      in: query
      name: cursor
      required: false
      schema: { type: string, maxLength: 200 }
      description: Opaque pagination cursor returned in previous `page.next_cursor`.
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema: { type: string, minLength: 1, maxLength: 60 }
      description: |
        Optional. Same `(scope, actor, key)` returns the cached response for 24 h.
        Same key + different body → `409 idempotency_mismatch`.
    IdempotencyKeyRequired:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 1, maxLength: 60 }
      description: |
        Required. Same `(scope, actor, key)` returns the cached response for 24 h.

  # ---------------------------------------------------------------------------
  # Reusable Headers
  # ---------------------------------------------------------------------------
  headers:
    XRateLimitLimit:
      schema: { type: integer }
      description: Window quota
    XRateLimitRemaining:
      schema: { type: integer }
      description: Remaining requests in the current window
    XRateLimitReset:
      schema: { type: integer }
      description: Unix epoch seconds at which the window resets
    RetryAfter:
      schema: { type: integer }
      description: Seconds before next retry is permitted

  # ---------------------------------------------------------------------------
  # Reusable Responses
  # ---------------------------------------------------------------------------
  responses:
    Unauthenticated:
      description: Missing / invalid / expired credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Field-level validation failures
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationErrorEnvelope' }
    RateLimited:
      description: Bucket exhausted
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    IdempotencyConflict:
      description: Same Idempotency-Key with a different request body
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PaymentProviderUnavailable:
      description: Kapital Bank degraded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  # ---------------------------------------------------------------------------
  # Schemas
  # ---------------------------------------------------------------------------
  schemas:

    # ----- Errors --------------------------------------------------------
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: subscription_required
            message_key:
              type: string
              example: errors.subscription_required
            message:
              type: string
              example: Aboneliyiniz başa çatıb.
            details:
              type: object
              additionalProperties: true
              nullable: true
            request_id:
              type: string
              example: 01JCGZ9F9XZ7P0X5MFK7Z7VYNZ

    ValidationErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, fields]
          properties:
            code: { type: string, example: validation_failed }
            message: { type: string }
            fields:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
              example:
                phone: ['Telefon nömrəsi düzgün formatda deyil.']
                code: ['Kod 6 rəqəm olmalıdır.']
            request_id: { type: string }

    # ----- Common --------------------------------------------------------
    PageInfo:
      type: object
      required: [has_more, limit]
      properties:
        next_cursor:
          type: string
          nullable: true
        has_more: { type: boolean }
        limit: { type: integer }

    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, degraded, unavailable] }
        version: { type: string, example: '1.0.0' }
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              ok: { type: boolean }
              latency_ms: { type: integer }
              message: { type: string, nullable: true }
      example:
        status: ok
        version: '1.0.0'
        checks:
          db: { ok: true, latency_ms: 2 }
          redis: { ok: true, latency_ms: 1 }
          queue: { ok: true }

    Jwks:
      type: object
      description: |
        *(v1.1, CRIT-04)* JWKS document. Two keys may be present during a rotation;
        verifiers pick by `kid` claim.
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, kid, use, alg, n, e]
            properties:
              kty: { type: string, enum: [RSA] }
              kid: { type: string, example: 'admin-2026-q3' }
              use: { type: string, enum: [sig] }
              alg: { type: string, enum: [RS256] }
              n: { type: string }
              e: { type: string }

    # ----- Auth ---------------------------------------------------------
    DeviceFingerprintInput:
      type: object
      required: [install_uuid, platform]
      properties:
        install_uuid:
          type: string
          format: uuid
        platform:
          type: string
          enum: [ios, android]
        os_version: { type: string, maxLength: 40 }
        app_version: { type: string, maxLength: 20 }
        device_model: { type: string, maxLength: 80 }
        push_token: { type: string, maxLength: 255, nullable: true }

    AuthSuccess:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, user]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, description: Access token TTL in seconds }
        refresh_expires_in: { type: integer }
        user: { $ref: '#/components/schemas/UserSelf' }

    AdminAuthSuccess:
      type: object
      required: [access_token, token_type, expires_in, admin]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer }
        admin: { $ref: '#/components/schemas/AdminUser' }

    # ----- User ---------------------------------------------------------
    UserSelf:
      type: object
      required: [id, phone, preferred_language, status]
      properties:
        id: { type: integer, format: int64 }
        phone: { type: string, example: '+994501234567' }
        full_name: { type: string, nullable: true, maxLength: 120 }
        email: { type: string, format: email, nullable: true, maxLength: 160 }
        email_verified_at: { type: string, format: date-time, nullable: true }
        preferred_language: { type: string, enum: [az, ru, en] }
        status: { type: string, enum: [active, blocked, self_deleted] }
        created_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time, nullable: true }
        has_active_subscription: { type: boolean }

    UserSelfUpdate:
      type: object
      additionalProperties: false
      properties:
        full_name: { type: string, minLength: 1, maxLength: 120, nullable: true }
        email: { type: string, format: email, maxLength: 160, nullable: true }
        preferred_language: { type: string, enum: [az, ru, en] }

    # ----- Device (user-facing) -----------------------------------------
    Device:
      type: object
      required: [id, label, status, role, can_open]
      properties:
        id: { type: integer, format: int64 }
        label: { type: string, maxLength: 160, description: location_label or serial fallback }
        serial: { type: string, maxLength: 64 }
        status:
          type: string
          enum: [active, suspended, disabled, decommissioned]
        role: { type: string, enum: [owner, user] }
        can_open:
          type: boolean
          description: True if the caller is allowed to open right now (sub active, device active, not in cooldown)
        suspension_reason:
          type: string
          description: |
            *(v1.1, CRIT-02)* Per-caller derived reason. `owner_sub_expired_others_active`
            is shown to owners whose own sub has lapsed while invitees still have active
            subs — the device is open-capable for others but not for the owner.
          enum:
            - none
            - subscription_expired
            - owner_sub_expired_others_active
            - device_disabled
            - device_suspended
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        geofence_enabled:
          type: boolean
          description: |
            *(GEOFENCE-1)* When true the app MUST attach the caller's GPS
            (`latitude`/`longitude`, optional `accuracy`) to `POST /devices/{id}/open`, or the
            server rejects with `location_required`. The backend holds and enforces the radius.
        geofence_radius_m:
          type: integer
          nullable: true
          minimum: 1
          maximum: 65535
          description: Allowed distance from the device in metres (null when the geofence is off).
        last_online_at: { type: string, format: date-time, nullable: true }
        image_url: { type: string, maxLength: 2048, nullable: true, description: Barrier photo URL (null → app shows a placeholder) }
        address: { type: string, maxLength: 255, nullable: true, description: Full street address (null → app shows a fallback) }

    DeviceDetail:
      allOf:
        - { $ref: '#/components/schemas/Device' }
        - type: object
          properties:
            device_model:
              type: object
              properties:
                vendor: { type: string }
                model_code: { type: string }
            cooldown_seconds_remaining: { type: integer, nullable: true }
            subscription: { $ref: '#/components/schemas/SubscriptionBrief' }

    DeviceGeofenceUpdate:
      type: object
      additionalProperties: false
      required: [geofence_enabled]
      properties:
        geofence_enabled:
          type: boolean
          description: Turn the device distance restriction on or off.
        geofence_radius_m:
          type: integer
          minimum: 1
          maximum: 65535
          nullable: true
          description: |
            Allowed distance from the device in metres. Required (positive) when
            `geofence_enabled` is true; cleared when false.

    DeviceListResponse:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Device' }
        page: { $ref: '#/components/schemas/PageInfo' }

    DeviceStats:
      type: object
      properties:
        period: { type: string, enum: [7d, 30d, 90d] }
        opens_total: { type: integer }
        opens_success: { type: integer }
        opens_failed: { type: integer }
        success_rate: { type: number, format: float, minimum: 0, maximum: 1 }
        avg_latency_ms: { type: integer, nullable: true }
        last_open_at: { type: string, format: date-time, nullable: true }

    # ----- Roster -------------------------------------------------------
    DeviceUser:
      type: object
      required: [id, user, role, status, added_at]
      properties:
        id: { type: integer, format: int64 }
        user: { $ref: '#/components/schemas/UserBrief' }
        role: { type: string, enum: [owner, user] }
        status: { type: string, enum: [active, revoked] }
        added_by_user: { $ref: '#/components/schemas/UserBrief' }
        added_at: { type: string, format: date-time }
        last_open_at: { type: string, format: date-time, nullable: true }
        subscription: { $ref: '#/components/schemas/SubscriptionBrief' }

    UserBrief:
      type: object
      properties:
        id: { type: integer, format: int64 }
        phone_masked: { type: string, example: '+994 50 *** 45 67' }
        # Full email — admin surface only (this schema is never rendered on the mobile API).
        email: { type: string, format: email, nullable: true, example: 'resident@example.com' }
        full_name: { type: string, nullable: true }

    DeviceRosterListResponse:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/DeviceUser' }
        page: { $ref: '#/components/schemas/PageInfo' }

    # ----- Invitations --------------------------------------------------
    InvitationCreate:
      type: object
      additionalProperties: false
      required: [invitee_phone, payer]
      properties:
        invitee_phone:
          type: string
          pattern: '^\+994\d{9}$'
        role:
          type: string
          enum: [user]
          default: user
        payer:
          type: string
          enum: [owner, invitee]
        return_url:
          type: string
          format: uri
          nullable: true
          description: Only used when payer=owner; for the immediate payment redirect

    Invitation:
      type: object
      required: [id, device_id, status, expires_at, role, payer]
      properties:
        id: { type: integer, format: int64 }
        device_id: { type: integer, format: int64 }
        invitee_phone: { type: string }
        invitee_user_id: { type: integer, format: int64, nullable: true }
        role: { type: string, enum: [user, owner] }
        payer: { type: string, enum: [owner, invitee] }
        token: { type: string }
        status: { type: string, enum: [pending, accepted, declined, expired, cancelled] }
        expires_at: { type: string, format: date-time }
        accepted_at: { type: string, format: date-time, nullable: true }
        linked_order_id: { type: integer, format: int64, nullable: true }
        created_at: { type: string, format: date-time }

    InvitationListResponse:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Invitation' }
        page: { $ref: '#/components/schemas/PageInfo' }

    # ----- Commands -----------------------------------------------------
    OpenCommandAccepted:
      type: object
      required: [command_id, state, expected_completion_ms, driver_confirms_actuation]
      properties:
        command_id: { type: integer, format: int64 }
        state: { type: string, enum: [queued, dispatching] }
        expected_completion_ms:
          type: integer
          example: 5000
          description: |
            *(v1.1, HIGH-14)* Server-computed estimate based on the device's driver and a
            rolling p90 of recent successful opens. The UX SHOULD size its progress UI to
            this hint, not to a fixed constant. Defaults to a per-driver constant when the
            rolling window has < 10 samples.
        driver_confirms_actuation:
          type: boolean
          description: |
            *(v1.2, CRIT-06 resolved)* When `true`, the driver observes an actuation signal
            (e.g. Traccar output-state read-back / command ack, or a BLE script ack); the terminal
            state `opened` carries real evidence and the UX should render "Açıldı".
            When `false` (no actuation feedback channel), the terminal state means
            "dispatched"; the UX should render "Göndərildi" and may prompt for user
            confirmation via `submitOpenFeedback`.
        websocket_channel:
          type: string
          example: 'private-user.42'

    OpenCommand:
      type: object
      required: [id, device_id, state, requested_at]
      properties:
        id: { type: integer, format: int64 }
        device_id: { type: integer, format: int64 }
        state: { type: string, enum: [queued, dispatching, dispatched, opened, failed, expired] }
        failure_reason: { type: string, nullable: true }
        driver: { type: string, enum: [traccar, ble, sms] }
        requested_at: { type: string, format: date-time }
        dispatched_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        latency_ms: { type: integer, nullable: true }
        attempts: { type: integer }

    OpenCommandListResponse:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/OpenCommand' }
        page: { $ref: '#/components/schemas/PageInfo' }

    # ----- Subscriptions ------------------------------------------------
    SubscriptionBrief:
      type: object
      properties:
        id: { type: integer, format: int64 }
        tier: { type: string, enum: [main, additional] }
        status: { type: string, enum: [pending_payment, active, expired, cancelled, refunded] }
        ends_at: { type: string, format: date-time, nullable: true }
        days_remaining: { type: integer, nullable: true }
        auto_renew: { type: boolean }

    Subscription:
      allOf:
        - { $ref: '#/components/schemas/SubscriptionBrief' }
        - type: object
          properties:
            device_id: { type: integer, format: int64 }
            user_id: { type: integer, format: int64 }
            starts_at: { type: string, format: date-time }
            price_minor: { type: integer }
            currency: { type: string, example: AZN }
            term_days: { type: integer }
            last_reminder_kind: { type: string, enum: [d30, d15, d7, d1, expired], nullable: true }
            last_reminder_sent_at: { type: string, format: date-time, nullable: true }

    SubscriptionDetail:
      allOf:
        - { $ref: '#/components/schemas/Subscription' }
        - type: object
          properties:
            periods:
              type: array
              items: { $ref: '#/components/schemas/SubscriptionPeriod' }
            latest_order: { $ref: '#/components/schemas/Order' }

    SubscriptionPeriod:
      type: object
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [initial, renewal, extension, refund] }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        amount_minor: { type: integer }
        order_id: { type: integer, format: int64 }

    SubscriptionListResponse:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Subscription' }
        page: { $ref: '#/components/schemas/PageInfo' }

    # ----- Orders & Payments --------------------------------------------
    OrderCreate:
      type: object
      additionalProperties: false
      required: [purpose, items]
      properties:
        purpose:
          type: string
          enum: [device_sale, sub_main, sub_additional, sub_renewal, bundle]
        items:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: '#/components/schemas/OrderItemCreate' }
        auto_renew:
          type: boolean
          default: false
        return_url:
          type: string
          format: uri
          example: 'salam://payment/return'

    OrderItemCreate:
      type: object
      additionalProperties: false
      required: [item_type, referenced_id, quantity]
      properties:
        item_type:
          type: string
          enum: [device, sub_main, sub_additional, sub_renewal]
        referenced_id:
          type: integer
          format: int64
          description: device_id or subscription_id depending on item_type
        quantity:
          type: integer
          minimum: 1
          maximum: 10

    Order:
      type: object
      required: [id, reference, status, amount_minor, currency, purpose, created_at]
      properties:
        id: { type: integer, format: int64 }
        reference: { type: string, example: 'SH-202606-000123' }
        status:
          type: string
          enum: [pending, authorising, paid, failed, cancelled, refunded, partially_refunded, expired]
        purpose:
          type: string
          enum: [device_sale, sub_main, sub_additional, sub_renewal, bundle]
        amount_minor: { type: integer }
        currency: { type: string, enum: [AZN] }
        bank_redirect_url: { type: string, format: uri, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        paid_at: { type: string, format: date-time, nullable: true }
        failed_at: { type: string, format: date-time, nullable: true }
        failed_reason: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }

    OrderItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        item_type: { type: string, enum: [device, sub_main, sub_additional, sub_renewal] }
        referenced_id: { type: integer, format: int64, nullable: true }
        description: { type: string }
        quantity: { type: integer }
        unit_amount_minor: { type: integer }
        total_amount_minor: { type: integer }

    OrderDetail:
      allOf:
        - { $ref: '#/components/schemas/Order' }
        - type: object
          properties:
            payments:
              type: array
              items: { $ref: '#/components/schemas/Payment' }
            refunds:
              type: array
              items: { $ref: '#/components/schemas/Refund' }
            timeline:
              type: array
              items:
                type: object
                properties:
                  at: { type: string, format: date-time }
                  event: { type: string }
                  detail: { type: string, nullable: true }

    OrderListResponse:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Order' }
        page: { $ref: '#/components/schemas/PageInfo' }

    Payment:
      type: object
      properties:
        id: { type: integer, format: int64 }
        order_id: { type: integer, format: int64 }
        bank_transaction_id: { type: string, nullable: true }
        type: { type: string, enum: [charge, refund, reversal] }
        amount_minor: { type: integer }
        currency: { type: string }
        status: { type: string, enum: [approved, declined, reversed, pending, error] }
        card_brand: { type: string, nullable: true }
        card_last4: { type: string, nullable: true, example: '1234' }
        occurred_at: { type: string, format: date-time }

    Refund:
      type: object
      properties:
        id: { type: integer, format: int64 }
        order_id: { type: integer, format: int64 }
        amount_minor: { type: integer }
        reason: { type: string }
        status: { type: string, enum: [requested, processing, approved, rejected, failed] }
        requested_by_admin_id: { type: integer, format: int64 }
        processed_by_admin_id: { type: integer, format: int64, nullable: true }
        linked_payment_id: { type: integer, format: int64, nullable: true }
        error_message: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    RefundListResponse:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Refund' }
        page: { $ref: '#/components/schemas/PageInfo' }

    # ----- Webhook payloads ---------------------------------------------
    KapitalCallback:
      type: object
      description: Kapital Bank callback payload. Field names mirror the bank's spec.
      additionalProperties: true
      required: [orderId, status]
      properties:
        orderId: { type: string }
        status:
          type: string
          enum: [APPROVED, DECLINED, CANCELED, REFUNDED, PENDING]
        amount: { type: string, description: 'Major-unit decimal, e.g. "12.00"' }
        currency: { type: string, example: AZN }
        rrn: { type: string, nullable: true }
        approvalCode: { type: string, nullable: true }
        pan: { type: string, description: 'Masked PAN', nullable: true }
        cardBrand: { type: string, nullable: true }

    # ----- Notifications ------------------------------------------------
    Notification:
      type: object
      required: [id, template_key, channel, status, created_at]
      properties:
        id: { type: integer, format: int64 }
        template_key: { type: string }
        channel: { type: string, enum: [push, sms, inapp, email] }
        payload:
          type: object
          additionalProperties: true
        status: { type: string, enum: [queued, sent, failed, read] }
        sent_at: { type: string, format: date-time, nullable: true }
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    NotificationListResponse:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        page: { $ref: '#/components/schemas/PageInfo' }
        unread_count: { type: integer }

    NotificationSetting:
      type: object
      properties:
        template_key: { type: string }
        channel: { type: string, enum: [push, sms, inapp, email] }
        enabled: { type: boolean }
        category: { type: string, enum: [security, billing, operational, marketing] }
        is_user_mutable: { type: boolean }

    NotificationSettingsListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/NotificationSetting' }

    NotificationSettingUpdate:
      type: object
      additionalProperties: false
      required: [template_key, channel, enabled]
      properties:
        template_key: { type: string, maxLength: 80 }
        channel: { type: string, enum: [push, sms, inapp, email] }
        enabled: { type: boolean }

    # ----- Notification Campaigns (admin-initiated) ---------------------
    AudienceSpec:
      type: object
      description: >-
        Recipient audience for an admin campaign. Recipients resolve to distinct user_id;
        complex_manager is server-scoped to its own complex. No other audience types.
      required: [scope]
      properties:
        scope: { type: string, enum: [all_users, user_ids, filter, complex] }
        user_ids:
          type: array
          items: { type: integer, format: int64 }
        filter:
          type: object
          properties:
            q: { type: string }
            complex_id: { type: integer, format: int64 }
            role: { type: string }
            subscription_status: { type: string }
        complex_id: { type: integer, format: int64 }

    AudiencePreview:
      type: object
      required: [recipient_count]
      properties:
        recipient_count: { type: integer, description: Server-resolved distinct user_id count (scoped). }

    NotificationCampaignCreate:
      type: object
      additionalProperties: false
      required: [type, title, body, language, audience, confirmed]
      properties:
        type: { type: string, enum: [system] }
        title: { type: string, minLength: 1, maxLength: 160 }
        body: { type: string, minLength: 1 }
        language: { type: string, enum: [az, ru, en] }
        audience: { $ref: '#/components/schemas/AudienceSpec' }
        confirmed: { type: boolean, description: Must be true — server returns 409 otherwise (mandatory send confirmation). }

    NotificationCampaign:
      type: object
      required: [id, type, title, body, language, audience_scope, status, created_at]
      properties:
        id: { type: integer, format: int64 }
        type: { type: string, enum: [system] }
        title: { type: string }
        body: { type: string }
        language: { type: string, enum: [az, ru, en] }
        audience_scope: { type: string, enum: [all_users, user_ids, filter, complex] }
        status: { type: string, enum: [draft, queued, sending, sent, failed] }
        total_recipients: { type: integer, nullable: true }
        sent_count: { type: integer }
        failed_count: { type: integer }
        created_by_admin_id: { type: integer, format: int64 }
        confirmed_at: { type: string, format: date-time, nullable: true }
        sent_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    NotificationCampaignListResponse:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/NotificationCampaign' }
        page: { $ref: '#/components/schemas/PageInfo' }

    # ----- Privacy ------------------------------------------------------
    ConsentCreate:
      type: object
      additionalProperties: false
      required: [consent_kind, document_version, granted]
      properties:
        consent_kind:
          type: string
          enum: [terms, privacy, marketing_push, marketing_sms, data_processing]
        document_version: { type: string, maxLength: 20 }
        granted: { type: boolean }

    Consent:
      type: object
      properties:
        id: { type: integer, format: int64 }
        consent_kind: { type: string }
        document_version: { type: string }
        granted: { type: boolean }
        created_at: { type: string, format: date-time }

    DataSubjectRequest:
      type: object
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [export, deletion, correction] }
        status: { type: string, enum: [received, processing, ready, delivered, failed, cancelled] }
        result_url: { type: string, format: uri, nullable: true }
        result_expires_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ----- Admin: Users -------------------------------------------------
    AdminUserListResponse:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/UserAdminBrief' }
        page: { $ref: '#/components/schemas/PageInfo' }

    UserAdminBrief:
      type: object
      properties:
        id: { type: integer, format: int64 }
        phone: { type: string }
        full_name: { type: string, nullable: true }
        email: { type: string, nullable: true }
        preferred_language: { type: string }
        status: { type: string, enum: [active, blocked, self_deleted] }
        device_count: { type: integer }
        active_subscriptions: { type: integer }
        created_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time, nullable: true }

    AdminUserDetail:
      allOf:
        - { $ref: '#/components/schemas/UserAdminBrief' }
        - type: object
          properties:
            blocked_reason: { type: string, nullable: true }
            blocked_by_admin_id: { type: integer, format: int64, nullable: true }
            installs:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer, format: int64 }
                  platform: { type: string }
                  os_version: { type: string, nullable: true }
                  app_version: { type: string, nullable: true }
                  last_seen_at: { type: string, format: date-time, nullable: true }
            devices:
              type: array
              items: { $ref: '#/components/schemas/Device' }

    # ----- Admin: Admins ------------------------------------------------
    AdminUser:
      type: object
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [super_admin, technical] }
        phone: { type: string, nullable: true }
        is_2fa_enabled: { type: boolean }
        status: { type: string, enum: [active, suspended, offboarded] }
        last_login_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    AdminUserCreate:
      type: object
      additionalProperties: false
      required: [email, name, role, password]
      properties:
        email: { type: string, format: email, maxLength: 160 }
        name: { type: string, minLength: 2, maxLength: 120 }
        role: { type: string, enum: [super_admin, technical] }
        phone: { type: string, pattern: '^\+994\d{9}$', nullable: true }
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: Must contain upper, lower, digit, and symbol.

    AdminUserUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        role: { type: string, enum: [super_admin, technical] }
        phone: { type: string, pattern: '^\+994\d{9}$', nullable: true }
        status: { type: string, enum: [active, suspended] }

    AdminUserListAdminsResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AdminUser' }
        page: { $ref: '#/components/schemas/PageInfo' }

    # ----- Admin: Dashboard ---------------------------------------------
    AdminMetricsOverview:
      type: object
      properties:
        period: { type: string }
        devices:
          type: object
          properties:
            total: { type: integer }
            active: { type: integer }
            online: { type: integer }
            offline: { type: integer }
            disabled: { type: integer }
        users:
          type: object
          properties:
            total: { type: integer }
            new_in_period: { type: integer }
        subscriptions:
          type: object
          properties:
            active: { type: integer }
            expiring_in_30d: { type: integer }
        opens:
          type: object
          properties:
            total: { type: integer }
            success: { type: integer }
            failed: { type: integer }
            success_rate: { type: number, format: float }
        revenue:
          type: object
          properties:
            gross_minor: { type: integer }
            refund_minor: { type: integer }
            net_minor: { type: integer }

    # ----- Admin: Devices -----------------------------------------------
    DeviceTechRegister:
      type: object
      additionalProperties: false
      required: [serial, device_model_id, sim_phone, driver_type]
      properties:
        serial: { type: string, minLength: 4, maxLength: 64 }
        device_model_id: { type: integer, format: int64 }
        sim_phone: { type: string, pattern: '^\+994\d{9}$' }
        sim_operator_id: { type: integer, format: int64, nullable: true }
        sim_iccid: { type: string, pattern: '^\d{19,22}$', nullable: true }
        driver_type: { type: string, enum: [traccar, ble, sms] }
        firmware_version: { type: string, maxLength: 40, nullable: true }
        region_id: { type: integer, format: int64, nullable: true }
        location_label: { type: string, maxLength: 160, nullable: true }
        image_url: { type: string, maxLength: 2048, nullable: true }
        address: { type: string, maxLength: 255, nullable: true }
        latitude: { type: number, nullable: true, minimum: -90, maximum: 90 }
        longitude: { type: number, nullable: true, minimum: -180, maximum: 180 }
        metadata: { type: object, additionalProperties: true, nullable: true }

    DeviceAdmin:
      type: object
      properties:
        id: { type: integer, format: int64 }
        serial: { type: string }
        sim_phone: { type: string }
        sim_operator: { $ref: '#/components/schemas/SimOperator' }
        device_model: { $ref: '#/components/schemas/DeviceModel' }
        driver_type: { type: string, enum: [traccar, ble, sms] }
        status: { type: string, enum: [unassigned, active, suspended, disabled, decommissioned] }
        owner: { $ref: '#/components/schemas/UserBrief' }
        region: { $ref: '#/components/schemas/Region' }
        location_label: { type: string, nullable: true }
        image_url: { type: string, maxLength: 2048, nullable: true }
        address: { type: string, maxLength: 255, nullable: true }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        geofence_enabled: { type: boolean, description: '*(GEOFENCE-1)* Distance restriction toggle.' }
        geofence_radius_m: { type: integer, nullable: true, minimum: 1, maximum: 65535, description: Allowed distance in metres (null when off). }
        last_online_at: { type: string, format: date-time, nullable: true }
        last_signal_strength: { type: integer, nullable: true }
        whitelist_capacity_used: { type: integer }
        created_at: { type: string, format: date-time }

    DeviceAdminDetail:
      allOf:
        - { $ref: '#/components/schemas/DeviceAdmin' }
        - type: object
          properties:
            users:
              type: array
              items: { $ref: '#/components/schemas/DeviceUser' }
            stats:
              type: object
              properties:
                opens_30d: { type: integer }
                success_rate_30d: { type: number }
                last_open_at: { type: string, format: date-time, nullable: true }
            metadata: { type: object, additionalProperties: true }

    DeviceAdminUpdate:
      type: object
      additionalProperties: false
      properties:
        firmware_version: { type: string, maxLength: 40, nullable: true }
        driver_type: { type: string, enum: [traccar, ble, sms] }
        sim_operator_id: { type: integer, nullable: true }
        sim_iccid: { type: string, pattern: '^\d{19,22}$', nullable: true }
        region_id: { type: integer, nullable: true }
        location_label: { type: string, maxLength: 160, nullable: true }
        image_url: { type: string, maxLength: 2048, nullable: true }
        address: { type: string, maxLength: 255, nullable: true }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        geofence_enabled: { type: boolean, description: '*(GEOFENCE-1)* Enabling needs a positive geofence_radius_m and existing device coordinates (else 422).' }
        geofence_radius_m: { type: integer, nullable: true, minimum: 1, maximum: 65535 }
        metadata: { type: object, additionalProperties: true, nullable: true }

    AdminDeviceListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/DeviceAdmin' }
        page: { $ref: '#/components/schemas/PageInfo' }

    DeviceDiagnostic:
      type: object
      properties:
        id: { type: integer, format: int64 }
        device_id: { type: integer, format: int64 }
        source: { type: string, enum: [scheduled_ping, open_dispatch, admin_ping, device_initiated] }
        online: { type: boolean }
        signal_strength: { type: integer, nullable: true, minimum: 0, maximum: 31 }
        battery_level: { type: integer, nullable: true }
        firmware_version: { type: string, nullable: true }
        reported_at: { type: string, format: date-time }

    DeviceDiagnosticListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/DeviceDiagnostic' }
        page: { $ref: '#/components/schemas/PageInfo' }

    WhitelistChange:
      type: object
      properties:
        id: { type: integer, format: int64 }
        device_id: { type: integer, format: int64 }
        action: { type: string, enum: [add, remove, clear] }
        phone: { type: string }
        status: { type: string, enum: [pending, in_progress, synced, failed, cancelled] }
        attempt_count: { type: integer }
        last_error: { type: string, nullable: true }
        last_attempt_at: { type: string, format: date-time, nullable: true }
        next_attempt_at: { type: string, format: date-time, nullable: true }
        synced_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    WhitelistChangeListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/WhitelistChange' }
        page: { $ref: '#/components/schemas/PageInfo' }

    # ----- Lookups ------------------------------------------------------
    SimOperator:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        country_iso: { type: string }
        mcc_mnc: { type: string, nullable: true }
        is_active: { type: boolean }

    DeviceModel:
      type: object
      properties:
        id: { type: integer }
        vendor: { type: string }
        model_code: { type: string }
        supports_clip: { type: boolean }
        supports_sms: { type: boolean }
        supports_mqtt: { type: boolean }
        default_driver_type: { type: string, enum: [traccar, ble, sms] }
        whitelist_capacity: { type: integer, nullable: true }
        sms_open_command: { type: string, nullable: true }
        is_active: { type: boolean }

    Region:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        parent_id: { type: integer, nullable: true }
        is_active: { type: boolean }

    # ----- Reports ------------------------------------------------------
    RevenueReport:
      type: object
      properties:
        since: { type: string, format: date }
        until: { type: string, format: date }
        totals:
          type: object
          properties:
            gross_minor: { type: integer }
            refund_minor: { type: integer }
            net_minor: { type: integer }
            tx_count: { type: integer }
        daily:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              purpose: { type: string }
              gross_minor: { type: integer }
              refund_minor: { type: integer }
              net_minor: { type: integer }
              tx_count: { type: integer }

    DeviceReport:
      type: object
      properties:
        status_counts:
          type: object
          additionalProperties: { type: integer }
        by_region:
          type: array
          items:
            type: object
            properties:
              region_id: { type: integer }
              region_name: { type: string }
              device_count: { type: integer }
              active: { type: integer }
              offline: { type: integer }
        offline_devices:
          type: array
          items:
            type: object
            properties:
              device_id: { type: integer, format: int64 }
              serial: { type: string }
              last_online_at: { type: string, format: date-time, nullable: true }

    SubscriptionReport:
      type: object
      properties:
        since: { type: string, format: date }
        until: { type: string, format: date }
        daily:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              active: { type: integer }
              expired: { type: integer }
              new: { type: integer }
              renewed: { type: integer }
              cancelled: { type: integer }

    ReportJobCreate:
      type: object
      additionalProperties: false
      required: [report_kind]
      properties:
        report_kind:
          type: string
          enum: [revenue.monthly, audit.export, devices.csv, subscriptions.csv, open_commands.csv]
        parameters:
          type: object
          additionalProperties: true

    ReportJob:
      type: object
      properties:
        id: { type: integer, format: int64 }
        report_kind: { type: string }
        parameters: { type: object, additionalProperties: true, nullable: true }
        status: { type: string, enum: [queued, running, succeeded, failed, expired] }
        result_url: { type: string, format: uri, nullable: true }
        result_expires_at: { type: string, format: date-time, nullable: true }
        error_message: { type: string, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    ReportJobListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ReportJob' }
        page: { $ref: '#/components/schemas/PageInfo' }

    # ----- Audit --------------------------------------------------------
    AuditLogEntry:
      type: object
      properties:
        id: { type: integer, format: int64 }
        actor_kind: { type: string, enum: [user, admin, system] }
        actor_id: { type: integer, format: int64, nullable: true }
        actor_label: { type: string, nullable: true }
        action: { type: string }
        entity_type: { type: string, nullable: true }
        entity_id: { type: integer, format: int64, nullable: true }
        payload_redacted: { type: object, additionalProperties: true, nullable: true }
        request_id: { type: string, nullable: true }
        ip: { type: string, nullable: true }
        user_agent: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    AuditLogListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AuditLogEntry' }
        page: { $ref: '#/components/schemas/PageInfo' }

    # ----- Settings / Flags --------------------------------------------
    Setting:
      type: object
      properties:
        key: { type: string }
        value: {}
        value_type: { type: string, enum: [int, string, bool, json, money_minor] }
        description: { type: string, nullable: true }
        updated_by_admin_id: { type: integer, format: int64, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }

    FeatureFlag:
      type: object
      properties:
        key: { type: string }
        is_enabled: { type: boolean }
        rollout_percent: { type: integer, minimum: 0, maximum: 100 }
        target_user_ids:
          type: array
          items: { type: integer, format: int64 }
          nullable: true
        description: { type: string, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }

    FeatureFlagUpdate:
      type: object
      additionalProperties: false
      properties:
        is_enabled: { type: boolean }
        rollout_percent: { type: integer, minimum: 0, maximum: 100 }
        target_user_ids:
          type: array
          items: { type: integer, format: int64 }
          nullable: true
        description: { type: string, maxLength: 255, nullable: true }

    # ----- Notification Templates --------------------------------------
    NotificationTemplate:
      type: object
      properties:
        id: { type: integer }
        template_key: { type: string }
        default_channels_mask: { type: integer, minimum: 0, maximum: 15 }
        category: { type: string, enum: [security, billing, operational, marketing] }
        is_user_mutable: { type: boolean }
        is_active: { type: boolean }
        updated_at: { type: string, format: date-time, nullable: true }

    NotificationTemplateDetail:
      allOf:
        - { $ref: '#/components/schemas/NotificationTemplate' }
        - type: object
          properties:
            locales:
              type: array
              items: { $ref: '#/components/schemas/NotificationTemplateLocale' }

    NotificationTemplateLocale:
      type: object
      properties:
        id: { type: integer }
        locale: { type: string, enum: [az, ru, en] }
        subject: { type: string, nullable: true }
        body: { type: string }
        updated_by_admin_id: { type: integer, format: int64, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }

    NotificationTemplateUpdate:
      type: object
      additionalProperties: false
      properties:
        default_channels_mask: { type: integer, minimum: 0, maximum: 15 }
        is_active: { type: boolean }
