    parameters: [{ $ref: '#/components/parameters/OrderId' }]
    post:
      tags: [Admin / Refunds]
      summary: Initiate a refund against an order
      operationId: adminRefundOrder
      security: [{ adminBearerAuth: [] }]
      x-authorization: super_admin
      parameters: [{ $ref: '#/components/parameters/IdempotencyKeyRequired' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_minor, reason]
              properties:
                amount_minor:
                  type: integer
                  minimum: 1
                  description: Refunded amount in qəpik; must be <= the order's net (gross minus prior refunds).
                reason:
                  type: string
                  minLength: 3
                  maxLength: 255
      responses:
        '201':
          description: Refund initiated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '409':
          description: Order not refundable in current state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

