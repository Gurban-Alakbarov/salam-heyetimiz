    parameters: [{ $ref: '#/components/parameters/DeviceId' }]
    post:
      tags: [Admin / Devices]
      summary: Upload the barrier photo (multipart)
      description: >
        Admin-only image upload. Server-side validated (real image + MIME + extension, ≤5 MB), optimised
        (downscaled to 1600px + WebP when GD is available), stored on the public disk, and the resulting
        public URL is written to `image_url`. Replaces (and deletes) any previously uploaded file. The
        response `image_url` contract is unchanged — a plain string URL.
      operationId: adminUploadDeviceImage
      security:
        - adminBearerAuth: []
      x-authorization: technical or super_admin (devices.update)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: JPG, JPEG, PNG or WEBP — max 5 MB
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceAdmin' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Admin / Devices]
      summary: Remove the barrier photo
      operationId: adminDeleteDeviceImage
      security:
        - adminBearerAuth: []
      x-authorization: technical or super_admin (devices.update)
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceAdmin' }

