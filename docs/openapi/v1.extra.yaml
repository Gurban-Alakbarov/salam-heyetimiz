                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/SettingsGroup' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/settings/{group}:
    patch:
      tags: [Admin / Settings]
      summary: Update one settings group
      operationId: adminUpdateSettings
      security: [{ adminBearerAuth: [] }]
      description: Requires `system.settings.manage`. Blank secret = keep existing. Audited per-key (old → new, secrets redacted).
      parameters:
        - { in: path, name: group, required: true, schema: { type: string, example: payments } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                values: { type: object, additionalProperties: true }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/SettingsGroup' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/settings/{group}/test:
    post:
      tags: [Admin / Settings]
      summary: Run a group-specific connectivity test
      operationId: adminTestSetting
      security: [{ adminBearerAuth: [] }]
      parameters:
        - { in: path, name: group, required: true, schema: { type: string, example: traccar } }
      responses:
        '200': { description: Test result, content: { application/json: { schema: { $ref: '#/components/schemas/TestActionResult' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/settings/export:
    get:
      tags: [Admin / Settings]
      summary: Export all settings as JSON (secrets as ciphertext)
      operationId: adminExportSettings
      security: [{ adminBearerAuth: [] }]
      responses:
        '200': { description: ok, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/settings/import:
    post:
      tags: [Admin / Settings]
      summary: Import settings from a JSON export
      operationId: adminImportSettings
      security: [{ adminBearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: true } } }
      responses:
        '200': { description: Imported }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/settings/versions:
    get:
      tags: [Admin / Settings]
      summary: Settings change history (snapshots)
      operationId: adminSettingsVersions
      security: [{ adminBearerAuth: [] }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/SettingsVersion' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/settings/versions/compare:
    get:
      tags: [Admin / Settings]
      summary: Diff two settings versions
      operationId: adminCompareSettingsVersions
      security: [{ adminBearerAuth: [] }]
      parameters:
        - { in: query, name: from, required: true, schema: { type: integer } }
        - { in: query, name: to, required: true, schema: { type: integer } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/settings/versions/{id}/restore:
    post:
      tags: [Admin / Settings]
      summary: Restore a settings version
      operationId: adminRestoreSettingsVersion
      security: [{ adminBearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: Restored }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/settings/email/send-test:
    post:
      tags: [Admin / Settings]
      summary: Send a test email via the configured SMTP
      operationId: adminSendTestEmail
      security: [{ adminBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties: { to: { type: string, format: email } }
      responses:
        '200': { description: Result, content: { application/json: { schema: { $ref: '#/components/schemas/TestActionResult' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/settings/email/send-test-otp:
    post:
      tags: [Admin / Settings]
      summary: Send a test OTP email
      operationId: adminSendTestOtp
      security: [{ adminBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties: { to: { type: string, format: email } }
      responses:
        '200': { description: Result, content: { application/json: { schema: { $ref: '#/components/schemas/TestActionResult' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/settings/sms/send-test:
    post:
      tags: [Admin / Settings]
      summary: Send a test SMS (fallback channel)
      operationId: adminSendTestSms
      security: [{ adminBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties: { to: { type: string, example: '+994501234567' } }
      responses:
        '200': { description: Result, content: { application/json: { schema: { $ref: '#/components/schemas/TestActionResult' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/settings/sms/send-test-otp:
    post:
      tags: [Admin / Settings]
      summary: Send a test OTP via SMS
      operationId: adminSendTestSmsOtp
      security: [{ adminBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties: { to: { type: string, example: '+994501234567' } }
      responses:
        '200': { description: Result, content: { application/json: { schema: { $ref: '#/components/schemas/TestActionResult' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/settings/traccar/status:
    get:
      tags: [Admin / Settings]
      summary: Live Traccar integration status
      operationId: adminTraccarStatus
      security: [{ adminBearerAuth: [] }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TraccarStatus' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/settings/security/force-logout:
    post:
      tags: [Admin / Settings]
      summary: Force-logout all admins (revoke + cutoff)
      operationId: adminForceLogout
      security: [{ adminBearerAuth: [] }]
      description: Requires `system.settings.manage`. Sets `security.force_logout_at`; every token issued before it is rejected.
      responses:
        '200': { description: All sessions invalidated }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/settings/payments/test-create:
    post:
      tags: [Admin / Settings]
      summary: Create a sandbox test payment (returns a confirmUrl)
      operationId: adminTestCreatePayment
      security: [{ adminBearerAuth: [] }]
      description: Requires `system.settings.manage`. Validates the BirPay config by creating a real sandbox payment and returning its confirmUrl.
      responses:
        '200': { description: confirmUrl issued, content: { application/json: { schema: { $ref: '#/components/schemas/TestActionResult' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ===========================================================================
  # Kapital Bank — payment lifecycle (browser redirect-back + inbound webhook)
  # ===========================================================================
  /payments/return:
    get:
      tags: [Kapital Bank]
      summary: Browser redirect-back from the BirPay hosted checkout
      operationId: paymentReturn
      security: []
      description: |
        Public. The hosted checkout redirects the customer here after pay/cancel. Query params are **not trusted** —
        the order is re-verified via `getOrderStatus` before any state change. Returns a small HTML/redirect.
      parameters:
        - { in: query, name: orderId, schema: { type: string } }
        - { in: query, name: paymentId, schema: { type: string } }
      responses:
        '200': { description: Verified — redirect / status page }
        '404': { $ref: '#/components/responses/NotFound' }

  /payments/webhook:
    post:
      tags: [Kapital Bank, Webhooks]
      summary: Inbound BirPay (Kapital) payment webhook
      operationId: birpayWebhook
      security: []
      description: |
        Inbound, **signature-authenticated** (no JWT). `X-Signature` = Base64(HMAC-SHA256(rawBody, sharedSecret))
        with the secret from Settings (`payments.webhook_secret`). Invalid/duplicate signatures are rejected.
        The webhook is treated as a *hint*: `getOrderStatus` is the authoritative source of truth. Idempotent.
        Events: `payment_succeeded`, `payment_canceled`.
      parameters:
        - in: header
          name: X-Signature
          required: true
          schema: { type: string }
          description: Base64 HMAC-SHA256 of the raw request body.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BirPayWebhookEvent' }
      responses:
        '200': { description: Accepted (idempotent) }
        '401': { description: Invalid or missing signature, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ===========================================================================
  # Traccar — telemetry event-forward
  # ===========================================================================
  /traccar/forward:
    post:
      tags: [Traccar, Webhooks]
      summary: Inbound Traccar telemetry event-forward
      operationId: traccarForward
      security: []
      description: |
        Inbound, **shared-secret token** authenticated (no JWT). Traccar forwards position/event payloads here;
        the controller ingests device telemetry (online state, last position).
      parameters:
        - in: header
          name: X-Traccar-Token
          required: true
          schema: { type: string }
          description: Shared secret negotiated with the Traccar instance.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TraccarForwardPayload' }
      responses:
        '200': { description: Ingested }
        '401': { description: Invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ===========================================================================
  # App Links — association files for the invitation universal / app links (B6)
  # ===========================================================================
  /.well-known/assetlinks.json:
    get:
      tags: [App Links]
      summary: Android App Links association file
      operationId: wellKnownAssetLinks
      security: []
      description: |
        Public web route. Served only once the Android signing identity is configured
        (`domain.app_links.android.sha256_cert_fingerprints`); **404** until then.
      responses:
        '200':
          description: Digital Asset Links statement list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WellKnownAssetLinks' }
        '404': { description: App-link identity not configured }

  /.well-known/apple-app-site-association:
    get:
      tags: [App Links]
      summary: iOS universal-links association file (no extension, served as JSON)
      operationId: wellKnownAasa
      security: []
      description: |
        Public web route. Served only once `domain.app_links.ios.app_id` is configured; **404** until then.
        `components` lists the link paths the app claims (e.g. `/invite/*`).
      responses:
        '200':
          description: Apple App Site Association document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WellKnownAasa' }
        '404': { description: App-link identity not configured }

  # ===========================================================================
  # Admin / Admins — Komendant ↔ mobile account link (B5)
  # ===========================================================================
  /admin/admins/{adminId}/mobile-user:
    parameters:
      - { in: path, name: adminId, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    post:
      tags: [Admin / Admins]
      summary: Link the mobile account a Komendant (complex_manager) signs in with
      operationId: adminLinkMobileUser
      security: [{ adminBearerAuth: [] }]
      description: |
        Requires `admins.update`. Only a `complex_manager` admin can be linked; the mobile account must already
        exist, be **active** and have a **verified** email. One mobile account per admin. Audited.
        Errors use the standard `{ error: { code, … } }` envelope: **422** `not_complex_manager` /
        `mobile_user_not_found`, **409** `mobile_user_already_linked`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminMobileUserLinkInput' }
      responses:
        '200':
          description: Linked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMobileUserLinkResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`mobile_user_already_linked` — the mobile account is linked to another admin'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: 'Validation error, or `not_complex_manager` / `mobile_user_not_found`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    delete:
      tags: [Admin / Admins]
      summary: Unlink the admin's mobile account
      operationId: adminUnlinkMobileUser
      security: [{ adminBearerAuth: [] }]
      description: Requires `admins.update`. Idempotent (clears `user_id`). Audited.
      responses:
        '200':
          description: Unlinked (`mobile_user` is null)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMobileUserLinkResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ===========================================================================
  # Admin / Applications — registration applications (B9)
  # ===========================================================================
  /admin/applications/individual:
    get:
      tags: [Admin / Applications]
      summary: List physical-person (individual) applications
      operationId: adminListIndividualApplications
      security: [{ adminBearerAuth: [] }]
      description: Requires `applications.view`. Offset-paginated (`meta.total/page/per_page`), newest first.
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [new, contacted, in_progress, installed, rejected] } }
        - { in: query, name: q, schema: { type: string }, description: Substring match on full name, phone or email }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: per_page, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/IndividualApplicationAdmin' } }
                  meta: { $ref: '#/components/schemas/OffsetPageMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/applications/individual/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    get:
      tags: [Admin / Applications]
      summary: Individual application detail
      operationId: adminGetIndividualApplication
      security: [{ adminBearerAuth: [] }]
      description: Requires `applications.view`.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/IndividualApplicationAdmin' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Admin / Applications]
      summary: Move an individual application through its pipeline
      operationId: adminUpdateIndividualApplication
      security: [{ adminBearerAuth: [] }]
      description: |
        Requires `applications.manage`. Allowed transitions: `new → contacted | in_progress | rejected`,
        `contacted → in_progress | rejected`, `in_progress → installed | rejected` (the row's `next_statuses`).
        `rejection_reason` is required when `status=rejected`. `device_id` (optional) must be a **private**-mode device.
        Errors: **422** `application_invalid_transition` / `application_invalid_device` (standard error envelope).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IndividualApplicationStatusUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/IndividualApplicationAdmin' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: 'Validation error, or `application_invalid_transition` / `application_invalid_device`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /admin/applications/legal:
    get:
      tags: [Admin / Applications]
      summary: List legal-entity applications
      operationId: adminListLegalApplications
      security: [{ adminBearerAuth: [] }]
      description: Requires `applications.view`. Offset-paginated (`meta.total/page/per_page`), newest first.
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [pending, approved, rejected] } }
        - { in: query, name: q, schema: { type: string }, description: Substring match on complex name, legal name or VÖEN }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: per_page, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/LegalApplicationAdmin' } }
                  meta: { $ref: '#/components/schemas/OffsetPageMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/applications/legal/{id}:
    get:
      tags: [Admin / Applications]
      summary: Legal-entity application detail
      operationId: adminGetLegalApplication
      security: [{ adminBearerAuth: [] }]
      description: Requires `applications.view`.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LegalApplicationAdmin' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/applications/legal/{id}/approve:
    post:
      tags: [Admin / Applications]
      summary: Approve a legal-entity application (creates the complex)
      operationId: adminApproveLegalApplication
      security: [{ adminBearerAuth: [] }]
      description: |
        Requires `applications.manage` **and** `complexes.manage`. Creates the residential complex in the same
        transaction and returns it alongside the application. **409** `application_not_pending` when already reviewed.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LegalApplicationApproveInput' }
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LegalApplicationApproved' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`application_not_pending`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/applications/legal/{id}/reject:
    post:
      tags: [Admin / Applications]
      summary: Reject a legal-entity application
      operationId: adminRejectLegalApplication
      security: [{ adminBearerAuth: [] }]
      description: Requires `applications.manage`. **409** `application_not_pending` when already reviewed.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LegalApplicationRejectInput' }
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LegalApplicationAdmin' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`application_not_pending`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ===========================================================================
  # Admin / Complexes — device binding, access model, people read models (B11)
  # ===========================================================================
  /admin/complexes/{complexId}/devices/{deviceId}:
    parameters:
      - { in: path, name: complexId, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      - { $ref: '#/components/parameters/DeviceId' }
    post:
      tags: [Admin / Complexes]
      summary: Bind a device to a complex
      operationId: adminBindComplexDevice
      security: [{ adminBearerAuth: [] }]
      description: |
        Requires `complexes.manage`. Runs on a row-locked device. Re-binding to the same complex is a no-op.
        **409** `device_in_other_complex` when the device is bound elsewhere. A `complex_manager` gets **404**
        for any other complex. Audited.
      responses:
        '200':
          description: Bound — the updated admin device
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceAdminWithAccessModel' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`device_in_other_complex`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    delete:
      tags: [Admin / Complexes]
      summary: Unbind a device from a complex
      operationId: adminUnbindComplexDevice
      security: [{ adminBearerAuth: [] }]
      description: |
        Requires `complexes.manage`. **404** when the device is not bound to this complex. **409**
        `device_is_complex_mode` — a complex-mode device can never be left without its complex (switch it to
        `private` first). Audited.
      responses:
        '200':
          description: Unbound — the updated admin device
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceAdminWithAccessModel' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`device_is_complex_mode`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /admin/complexes/{complexId}/members:
    get:
      tags: [Admin / Complexes]
      summary: Residents (complex members) of a complex
      operationId: adminListComplexMembers
      security: [{ adminBearerAuth: [] }]
      description: |
        Requires `residents.view`. Up to 500 rows, newest first. `active_subscriptions` counts the member's live
        subscriptions on the complex's shared (complex-mode) devices. Phone is returned in full for global roles and
        **masked** for a complex-scoped manager (who gets **404** for any other complex).
      parameters:
        - { in: path, name: complexId, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { in: query, name: status, schema: { type: string, enum: [active, removed], default: active } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ComplexMemberAdmin' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ===========================================================================
  # Admin / Residents — invitations read model + account removal
  # ===========================================================================
  /admin/invitations:
    get:
      tags: [Admin / Residents]
      summary: Invitations directory (complex-resident + family-member)
      operationId: adminListInvitations
      security: [{ adminBearerAuth: [] }]
      description: |
        Requires `residents.view`. Up to 200 rows, newest first. A pending invitation past `expires_at` is reported as
        `expired`. A `complex_manager` sees only its own complex's `complex_resident` invitations (`complex_id` /
        `kind` filters are then ignored / narrowed).
      parameters:
        - { in: query, name: complex_id, schema: { type: integer, format: int64 } }
        - { in: query, name: kind, schema: { type: string, enum: [family_member, complex_resident] } }
        - { in: query, name: status, schema: { type: string, enum: [pending, accepted, declined, expired, cancelled] } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AdminInvitationRow' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/residents/{userId}:
    delete:
      tags: [Admin / Residents]
      summary: Delete a resident account
      operationId: adminDeleteResident
      security: [{ adminBearerAuth: [] }]
      description: |
        Requires `residents.delete`. A `complex_manager` gets **403** when the resident has active roster rows on
        devices outside its complex. **409** `resident_owns_device` when the user still owns a device.
      parameters:
        - { in: path, name: userId, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`resident_owns_device`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  # ===========================================================================
  # Admin / Subscriptions — detail
  # ===========================================================================
  /admin/subscriptions/{id}:
    get:
      tags: [Admin / Subscriptions]
      summary: Subscription detail (device, beneficiary, periods)
      operationId: adminGetSubscription
      security: [{ adminBearerAuth: [] }]
      description: Requires `subscriptions.view`. A `complex_manager` gets **404** for subscriptions on devices outside its complex.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AdminSubscriptionDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ===========================================================================
  # Admin / Devices — access model, relay test, manual grant
  # ===========================================================================
  /admin/devices/{deviceId}/ownership-mode:
    post:
      tags: [Admin / Devices]
      summary: Switch a device between private and complex ownership
      operationId: adminChangeDeviceOwnershipMode
      security: [{ adminBearerAuth: [] }]
      description: |
        Requires `devices.update`. Same mode → no-op (200). Refusals are **409**:
        `device_not_in_complex` (→ complex needs a bound complex), `device_has_owner_or_roster` (→ complex needs no
        owner and no active roster), `device_has_roster_or_subscription` (→ private needs no active roster and no
        active subscription). Audited.
      parameters: [{ $ref: '#/components/parameters/DeviceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceOwnershipModeInput' }
      responses:
        '200':
          description: Updated (or unchanged) admin device
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceAdminWithAccessModel' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`device_not_in_complex` | `device_has_owner_or_roster` | `device_has_roster_or_subscription`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/devices/{deviceId}/relay:
    post:
      tags: [Admin / Devices]
      summary: Relay open/close test through the DeviceComm pipeline
      operationId: adminRelayTest
      security: [{ adminBearerAuth: [] }]
      description: |
        Requires `commands.test`. Queues an open/close relay command (`source=admin`) and returns it with **202**;
        poll `GET /admin/v1/devices/{deviceId}/commands` to watch it reach `opened` / `failed` with the device's
        terminal response text. Complex-scoped (other complexes → 404).
      parameters: [{ $ref: '#/components/parameters/DeviceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RelayTestInput' }
      responses:
        '202':
          description: Command queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenCommandAdmin' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/devices/{deviceId}/users/{userId}/subscription:
    post:
      tags: [Admin / Devices]
      summary: Grant a roster member a subscription without payment
      operationId: adminGrantSubscription
      security: [{ adminBearerAuth: [] }]
      description: |
        Requires `subscriptions.manage`. Activates (or extends) the active roster member's entitlement — no order,
        no money. Defaults: `tier=additional`, `term_days` = configured term (365). Returns the refreshed roster row.
        **404** `roster_member_not_found` when the user has no active row on the device.
      parameters:
        - { $ref: '#/components/parameters/DeviceId' }
        - { in: path, name: userId, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantSubscriptionInput' }
      responses:
        '200':
          description: Granted — roster row with the new subscription brief
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceUser' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Device not found / out of scope, or `roster_member_not_found`
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ===========================================================================
  # Admin / Visitor Links
  # ===========================================================================
  /admin/visitor-links:
    get:
      tags: [Admin / Visitor Links]
      summary: Visitor-link directory with server-side filters
      operationId: adminListVisitorLinks
      security: [{ adminBearerAuth: [] }]
      description: Requires `visitor_links.view`. Complex-scoped for `complex_manager`. Cursor-paginated, newest first.
      parameters:
        - { in: query, name: device_id, schema: { type: integer, format: int64 } }
        - { in: query, name: status, schema: { type: string, enum: [active, used, expired, revoked] }, description: 'Derived status (`used` = usage exhausted); omit for all' }
        - { in: query, name: q, schema: { type: string }, description: Substring match on visitor name }
        - { in: query, name: purpose, schema: { $ref: '#/components/schemas/VisitorPurpose' } }
        - { in: query, name: access_type, schema: { type: string, enum: [one_time, time_limited] } }
        - { in: query, name: created_by, schema: { type: string, enum: [admin, resident] } }
        - { in: query, name: created_from, schema: { type: string, format: date }, description: Inclusive (start of day) }
        - { in: query, name: created_to, schema: { type: string, format: date }, description: Inclusive (end of day) }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/VisitorLinkAdmin' } }
                  page: { $ref: '#/components/schemas/PageInfo' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/visitor-links/{id}/usages:
    get:
      tags: [Admin / Visitor Links]
      summary: A visitor link's audited open attempts
      operationId: adminVisitorLinkUsages
      security: [{ adminBearerAuth: [] }]
      description: Requires `visitor_links.view`. Complex-scoped (other complexes → 404). Cursor-paginated, newest first.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/VisitorLinkUsage' } }
                  page: { $ref: '#/components/schemas/PageInfo' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/devices/{deviceId}/visitor-links:
    post:
      tags: [Admin / Visitor Links]
      summary: Create a visitor link for a device (token returned once)
      operationId: adminCreateVisitorLink
      security: [{ adminBearerAuth: [] }]
      description: |
        Requires `visitor_links.manage`. Complex-scoped. Same rules as the resident flow (shared service). The
        plaintext `token` / `url` are returned **only here** — only the hash is stored.
        **409** `visitor_link_limit_reached` (`details.scope` = `creator` | `device`, `details.limit`).
      parameters: [{ $ref: '#/components/parameters/DeviceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VisitorLinkCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisitorLinkAdminCreated' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`visitor_link_limit_reached`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/visitor-links/{id}/revoke:
    post:
      tags: [Admin / Visitor Links]
      summary: Revoke a visitor link immediately
      operationId: adminRevokeVisitorLink
      security: [{ adminBearerAuth: [] }]
      description: Requires `visitor_links.manage`. Complex-scoped (other complexes → 404).
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/VisitorLinkAdmin' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ===========================================================================
  # Applications (mobile) — the caller's own registration applications (B9)
  # ===========================================================================
  /applications/mine:
    get:
      tags: [Applications]
      summary: The caller's own applications (both types) + account type
      operationId: listMyApplications
      security: [{ bearerAuth: [] }]
      description: Up to 50 of each type, newest first. `account_type` is null for legacy accounts.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/MyApplications' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /applications/individual:
    post:
      tags: [Applications]
      summary: Submit a physical-person (individual) application
      operationId: createIndividualApplication
      security: [{ bearerAuth: [] }]
      description: |
        Location is the map pin, which must lie inside the configured service area. One open application per user.
        **409** `application_already_open` / `account_type_mismatch` (standard error envelope).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IndividualApplicationInput' }
      responses:
        '201':
          description: Submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/IndividualApplication' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409':
          description: '`application_already_open` | `account_type_mismatch`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /applications/individual/{id}:
    put:
      tags: [Applications]
      summary: Edit the caller's individual application (only while `new`)
      operationId: updateIndividualApplication
      security: [{ bearerAuth: [] }]
      description: Full replacement (same body as create). Another user's application → **404**. **409** `application_not_editable` once it left `new`.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IndividualApplicationInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/IndividualApplication' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`application_not_editable`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /applications/legal:
    post:
      tags: [Applications]
      summary: Submit a legal-entity (residential complex) application
      operationId: createLegalApplication
      security: [{ bearerAuth: [] }]
      description: |
        VÖEN = 10 digits; one pending application per VÖEN. **409** `application_duplicate_voen` /
        `account_type_mismatch` (standard error envelope).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LegalApplicationInput' }
      responses:
        '201':
          description: Submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LegalApplication' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409':
          description: '`application_duplicate_voen` | `account_type_mismatch`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /applications/legal/{id}:
    put:
      tags: [Applications]
      summary: Edit the caller's legal-entity application (only while `pending`)
      operationId: updateLegalApplication
      security: [{ bearerAuth: [] }]
      description: Full replacement (same body as create). Another user's application → **404**. **409** `application_not_editable` / `application_duplicate_voen`.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LegalApplicationInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LegalApplication' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`application_not_editable` | `application_duplicate_voen`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ===========================================================================
  # Complexes (mobile) — resident browse + subscribe (B7)
  # ===========================================================================
  /complexes:
    get:
      tags: [Complexes]
      summary: Complexes the caller is an active resident of
      operationId: listMyComplexes
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: ok (ordered by name)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ResidentComplex' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /complexes/{complexId}:
    get:
      tags: [Complexes]
      summary: One of the caller's complexes
      operationId: getComplex
      security: [{ bearerAuth: [] }]
      description: Non-members get **404** (existence is not revealed).
      parameters:
        - { in: path, name: complexId, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ResidentComplex' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /complexes/{complexId}/devices:
    get:
      tags: [Complexes]
      summary: The complex's shared devices with price + the caller's own status
      operationId: listComplexDevices
      security: [{ bearerAuth: [] }]
      description: |
        Only active, complex-mode devices. Shows the monthly subscription price (never the sale price) and the
        CALLER's own subscription status — never other residents' data. Non-members get **404**.
      parameters:
        - { in: path, name: complexId, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ComplexDeviceOffer' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /complexes/{complexId}/devices/{deviceId}/subscribe:
    post:
      tags: [Complexes]
      summary: Start (pay for) the caller's subscription on a shared complex device
      operationId: subscribeComplexDevice
      security: [{ bearerAuth: [] }]
      description: |
        **Idempotency-Key is required** (absent → 422 `validation_failed` with field `Idempotency-Key`). Creates the
        caller's roster row + pending subscription and an order — same contract as `createOrder`: open
        `bank_redirect_url` to pay. Non-members / devices not in the complex → **404**. **409**
        `subscription_already_active` (`details.subscription_id`).
      parameters:
        - { in: path, name: complexId, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { $ref: '#/components/parameters/DeviceId' }
        - { $ref: '#/components/parameters/IdempotencyKeyRequired' }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComplexSubscribeInput' }
      responses:
        '201':
          description: Order created (pending payment)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderWithTestFlag' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`subscription_already_active` (or an idempotency conflict)'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ===========================================================================
  # Visitor Links (mobile resident)
  # ===========================================================================
  /devices/{deviceId}/visitor-links:
    parameters: [{ $ref: '#/components/parameters/DeviceId' }]
    post:
      tags: [Visitor Links]
      summary: Share access to a device as a visitor link (token returned once)
      operationId: createVisitorLink
      security: [{ bearerAuth: [] }]
      description: |
        A resident may share only access they hold — gated by the same check as opening. Errors (standard envelope):
        **403** `subscription_required` / `device_disabled` / `forbidden` / `family_member_cannot_share` (family-granted
        access never extends to visitor links), **404** device not visible, **409** `visitor_link_limit_reached`
        (`details.scope` = `creator` | `device`). The plaintext `token` / `url` appear **only** in this response.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VisitorLinkCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisitorLinkCreated' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: '`subscription_required` | `device_disabled` | `forbidden` | `family_member_cannot_share`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`visitor_link_limit_reached`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [Visitor Links]
      summary: The caller's own visitor links for this device
      operationId: listVisitorLinks
      security: [{ bearerAuth: [] }]
      description: Up to 50, newest first (not paginated). Device not visible → **404**.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/VisitorLink' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /visitor-links:
    get:
      tags: [Visitor Links]
      summary: The caller's own visitor links across all devices ("Dəvətlərim")
      operationId: listMyVisitorLinks
      security: [{ bearerAuth: [] }]
      description: Ownership is enforced server-side. Rows here also carry `first_used_at`. Cursor-paginated, newest first.
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [active, used, expired, revoked] }, description: 'Derived status (`used` = usage exhausted); omit for all' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/VisitorLink' } }
                  page: { $ref: '#/components/schemas/PageInfo' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /visitor-links/{id}/revoke:
    post:
      tags: [Visitor Links]
      summary: Revoke one of the caller's own visitor links
      operationId: revokeVisitorLink
      security: [{ bearerAuth: [] }]
      description: Another user's link → **404**.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/VisitorLink' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ===========================================================================
  # Visitor Access (public — the path token is the credential; used by the /v/{token} page)
  # ===========================================================================
  /visit/{token}:
    get:
      tags: [Visitor Access]
      summary: Visitor link status for the public visitor page
      operationId: visitorLinkStatus
      security: []
      description: |
        No auth — the token is the credential. Anonymous-safe payload (no internal ids, no contact details);
        `coordinates` only while the link is usable. Unknown token → **404** `visitor_link_not_found`. A known but
        unusable link still answers **200** with `valid=false` and `reason`. Throttle `public` (30/min/IP).
      parameters:
        - { in: path, name: token, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]+$', example: 'VISITOR_LINK_TOKEN' }, description: 'Plaintext visitor-link token (the credential)' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisitorLinkPublicStatus' }
        '404':
          description: '`visitor_link_not_found`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /visit/{token}/open:
    post:
      tags: [Visitor Access]
      summary: Open the barrier with a visitor link
      operationId: visitorLinkOpen
      security: []
      description: |
        Issues the relay through the SAME pipeline as the mobile app; every attempt is audited. Poll
        `GET /v1/visit/{token}/command/{commandId}` for the outcome. Refusals (standard envelope):
        **404** `visitor_link_not_found`, **410** `visitor_link_expired`, **403** `visitor_link_revoked` /
        `visitor_link_usage_exceeded`, **409** `visitor_device_inactive`. Throttle `visitor-open`
        (6/min per token + 20/min per IP).
      parameters:
        - { in: path, name: token, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]+$', example: 'VISITOR_LINK_TOKEN' }, description: 'Plaintext visitor-link token (the credential)' }
      responses:
        '202':
          description: Open command accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisitorOpenAccepted' }
        '403':
          description: '`visitor_link_revoked` | `visitor_link_usage_exceeded`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: '`visitor_link_not_found`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: '`visitor_device_inactive`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '410':
          description: '`visitor_link_expired`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /visit/{token}/command/{commandId}:
    get:
      tags: [Visitor Access]
      summary: Poll a visitor open command's state
      operationId: visitorLinkCommand
      security: []
      description: Scoped to the link — a command not issued through this link answers **404**.
      parameters:
        - { in: path, name: token, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]+$', example: 'VISITOR_LINK_TOKEN' }, description: 'Plaintext visitor-link token (the credential)' }
        - { in: path, name: commandId, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisitorCommandState' }
        '404':
          description: Unknown token (`visitor_link_not_found`) or command not of this link
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ===========================================================================
  # Family (B8) — the caller as family head
  # ===========================================================================
  /family/members:
    get:
      tags: [Family]
      summary: The caller's active family members with their granted devices
      operationId: listFamilyMembers
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/FamilyMember' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Family]
      summary: Invite a family member to one device (same as POST /v1/devices/{deviceId}/invitations)
      operationId: inviteFamilyMember
      security: [{ bearerAuth: [] }]
      description: |
        Family head only (`DevicePolicy::manageFamily`): device not visible → **404**, not the head → **403**.
        An existing active family member is granted the device directly (`granted=true`, a pending `additional`
        subscription is opened for the head to pay via `POST /v1/orders`); anyone else gets a `family_member`
        invitation email (`granted=false`). Errors (standard envelope): **409** `invitation_already_pending` /
        `invitation_already_has_access`, **422** `invitation_invalid_target` (e.g. inviting yourself), **429**
        `invitation_rate_limited`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FamilyMemberInviteInput' }
      responses:
        '201':
          description: Invitation sent, or device granted to an existing member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FamilyInviteResultResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`invitation_already_pending` | `invitation_already_has_access`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: 'Validation error, or `invitation_invalid_target`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429':
          description: '`invitation_rate_limited`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /family/members/{userId}:
    delete:
      tags: [Family]
      summary: Remove a family member
      operationId: removeFamilyMember
      security: [{ bearerAuth: [] }]
      description: Family link removed, all access granted through it revoked, its subscriptions cancelled (no refund). Not the caller's member → **404**.
      parameters:
        - { in: path, name: userId, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AccessRemovalResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /family/subscriptions:
    get:
      tags: [Family]
      summary: Family members' subscriptions the caller may pay for
      operationId: listFamilySubscriptions
      security: [{ bearerAuth: [] }]
      description: Pay with the existing `POST /v1/orders` (`purpose=sub_additional`, item `sub_additional` referencing the subscription id).
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/FamilySubscriptionRow' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /family/invitations/{id}/resend:
    post:
      tags: [Family]
      summary: Re-send one of the caller's family invitations
      operationId: resendFamilyInvitation
      security: [{ bearerAuth: [] }]
      description: Not the caller's family invitation → **404**. **409** `invitation_not_resendable`, **429** `invitation_rate_limited` (cool-down).
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200':
          description: Re-sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/FamilyInvitation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`invitation_not_resendable`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429':
          description: '`invitation_rate_limited`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /family/invitations/{id}/revoke:
    post:
      tags: [Family]
      summary: Revoke one of the caller's family invitations
      operationId: revokeFamilyInvitation
      security: [{ bearerAuth: [] }]
      description: Not the caller's family invitation → **404**. **409** `invitation_not_revocable`.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/FamilyInvitation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`invitation_not_revocable`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  # ===========================================================================
  # Invitations (B6) — token lookup / accept / decline (unified envelope)
  # ===========================================================================
  /invites/{token}:
    get:
      tags: [Invitations]
      summary: Look up a live invitation by its link token
      operationId: getInvitation
      security: []
      description: |
        Public (throttle `public`). Unified envelope `{ success, message, data, meta, errors }`. Shows only what the
        invitee may see before signing in — no ids, email masked. **Every** non-live token (unknown, expired,
        revoked, accepted, declined) answers the SAME **410** with `errors.code = invitation_invalid`.
        New users claim through `POST /v1/auth/register` → `POST /v1/auth/verify-email` with `invitation_token`;
        existing users call `/accept`.
      parameters:
        - { in: path, name: token, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]+$', example: 'INVITATION_TOKEN' }, description: 'Plaintext invitation-link token (the credential)' }
      responses:
        '200':
          description: Live invitation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteLookupEnvelope' }
        '410':
          description: '`invitation_invalid` (uniform for every non-live token)'
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthEnvelopeError' } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /invites/{token}/accept:
    post:
      tags: [Invitations]
      summary: Accept an invitation as the signed-in invitee
      operationId: acceptInvite
      security: [{ bearerAuth: [] }]
      description: |
        Route name `acceptInvitation` (that operationId is already taken by the legacy `/invitations/{token}/accept`).
        The caller's **verified** email must match the invitation. Unified envelope. `complex_resident` → joins the
        complex; `family_member` → family link + device access + a pending subscription.
        Errors (`errors.code`): **410** `invitation_invalid`, **403** `invitation_email_mismatch` (also for an
        unverified email), **409** `invitation_kind_unsupported` / `invitation_already_has_access`,
        **422** `invitation_invalid_target`.
      parameters:
        - { in: path, name: token, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]+$', example: 'INVITATION_TOKEN' }, description: 'Plaintext invitation-link token (the credential)' }
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteAcceptEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: '`invitation_email_mismatch`'
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthEnvelopeError' } } }
        '409':
          description: '`invitation_kind_unsupported` | `invitation_already_has_access`'
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthEnvelopeError' } } }
        '410':
          description: '`invitation_invalid`'
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthEnvelopeError' } } }
        '422':
          description: '`invitation_invalid_target`'
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthEnvelopeError' } } }

  /invites/{token}/decline:
    post:
      tags: [Invitations]
      summary: Decline an invitation as the signed-in invitee
      operationId: declineInvite
      security: [{ bearerAuth: [] }]
      description: |
        Route name `declineInvitation` (that operationId is already taken by the legacy `/invitations/{token}/decline`).
        Unified envelope; `data` is null on success. Same error codes as accept (**410** `invitation_invalid`,
        **403** `invitation_email_mismatch`, **409** `invitation_kind_unsupported`).
      parameters:
        - { in: path, name: token, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]+$', example: 'INVITATION_TOKEN' }, description: 'Plaintext invitation-link token (the credential)' }
      responses:
        '200':
          description: Declined
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteDeclineEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: '`invitation_email_mismatch`'
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthEnvelopeError' } } }
        '409':
          description: '`invitation_kind_unsupported`'
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthEnvelopeError' } } }
        '410':
          description: '`invitation_invalid`'
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthEnvelopeError' } } }

  # ===========================================================================
  # Komendant (B5) — mobile surface of a linked complex_manager
  # ===========================================================================
  /komendant/complex:
    get:
      tags: [Komendant]
      summary: The Komendant's complex with headline stats
      operationId: komendantComplex
      security: [{ bearerAuth: [] }]
      description: |
        Every `/v1/komendant/*` route requires a mobile user linked to an ACTIVE `complex_manager` with an assigned
        complex — otherwise **403** `not_komendant`. Scope is always the manager's complex (never client-supplied).
        Each action also checks the manager's RBAC permission (here `complexes.view`; missing → **403**).
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/KomendantComplex' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: '`not_komendant`, or the manager lacks the permission'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /komendant/devices:
    get:
      tags: [Komendant]
      summary: The complex's shared devices (monthly price only)
      operationId: komendantDevices
      security: [{ bearerAuth: [] }]
      description: Requires `devices.view`. Complex-mode devices only, ordered by label; never the sale price.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/KomendantDevice' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: '`not_komendant`, or the manager lacks the permission'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /komendant/residents:
    get:
      tags: [Komendant]
      summary: Active residents of the complex
      operationId: komendantResidents
      security: [{ bearerAuth: [] }]
      description: Requires `residents.view`. Up to 500, most recently joined first. Phone masked.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/KomendantResident' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: '`not_komendant`, or the manager lacks the permission'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /komendant/residents/{userId}:
    delete:
      tags: [Komendant]
      summary: Remove a resident from the complex
      operationId: komendantRemoveResident
      security: [{ bearerAuth: [] }]
      description: Requires `residents.delete`. Access on the complex's devices revoked, subscriptions cancelled (no refund). Not a resident of this complex → **404**.
      parameters:
        - { in: path, name: userId, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AccessRemovalResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: '`not_komendant`, or the manager lacks the permission'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /komendant/invitations:
    get:
      tags: [Komendant]
      summary: The complex's resident invitations
      operationId: komendantListInvitations
      security: [{ bearerAuth: [] }]
      description: Requires `residents.view`. Up to 200, newest first. A pending invitation past `expires_at` is reported as `expired`.
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [pending, accepted, declined, expired, cancelled] } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/KomendantInvitation' } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: '`not_komendant`, or the manager lacks the permission'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    post:
      tags: [Komendant]
      summary: Invite a resident into the complex (email link)
      operationId: komendantCreateInvitation
      security: [{ bearerAuth: [] }]
      description: |
        Requires `residents.create`. Errors (standard envelope): **409** `already_resident` /
        `invitation_already_pending`, **422** validation / `invitation_invalid_target`, **429** `invitation_rate_limited`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteeInput' }
      responses:
        '201':
          description: Invitation created + emailed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/KomendantInvitation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: '`not_komendant`, or the manager lacks the permission'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: '`already_resident` | `invitation_already_pending`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: 'Validation error, or `invitation_invalid_target`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429':
          description: '`invitation_rate_limited`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /komendant/invitations/{id}/resend:
    post:
      tags: [Komendant]
      summary: Re-send a complex invitation
      operationId: komendantResendInvitation
      security: [{ bearerAuth: [] }]
      description: Requires `residents.create`. Not this complex's invitation → **404**. **409** `invitation_not_resendable`, **429** `invitation_rate_limited`.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200':
          description: Re-sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/KomendantInvitation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: '`not_komendant`, or the manager lacks the permission'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`invitation_not_resendable`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429':
          description: '`invitation_rate_limited`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /komendant/invitations/{id}/revoke:
    post:
      tags: [Komendant]
      summary: Revoke a complex invitation
      operationId: komendantRevokeInvitation
      security: [{ bearerAuth: [] }]
      description: Requires `residents.delete`. Not this complex's invitation → **404**. **409** `invitation_not_revocable`.
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/KomendantInvitation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: '`not_komendant`, or the manager lacks the permission'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`invitation_not_revocable`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  # ===========================================================================
  # Simulated hosted payment page ("TEST ÖDƏNİŞ") — fake gateway only (B1)
  # ===========================================================================
  /payments/fake-checkout/{reference}:
    get:
      tags: [Orders & Payments]
      summary: Simulated BirPay hosted payment page (HTML)
      operationId: fakeCheckout
      security: []
      description: |
        Exists **only while the fake gateway is active** (otherwise **404**). Reached via the signed, expiring
        `bank_redirect_url` of a test order (`is_test=true`) — never call it by hand. Renders a "TEST ÖDƏNİŞ" page
        whose buttons POST to the signed action URLs. Missing / invalid / expired signature → **403**.
      parameters:
        - { in: path, name: reference, required: true, schema: { type: string, example: 'SH-202606-000123' } }
        - { in: query, name: expires, required: true, schema: { type: integer, example: 1767225600 }, description: 'Signed-URL expiry (Unix seconds) — part of the minted link' }
        - { in: query, name: signature, required: true, schema: { type: string, example: 'SIGNATURE_HEX' }, description: 'Signed-URL HMAC — part of the minted link' }
      responses:
        '200':
          description: The simulated checkout page (`Cache-Control:no-store`, `X-Robots-Tag:noindex`)
          content:
            text/html:
              schema: { type: string }
        '403': { description: Invalid or expired signature }
        '404': { description: Fake gateway inactive, or no such test order }
        '429': { $ref: '#/components/responses/RateLimited' }

  /payments/fake-checkout/{reference}/{action}:
    post:
      tags: [Orders & Payments]
      summary: Simulate the bank outcome for a test order
      operationId: fakeCheckoutAction
      security: []
      description: |
        Fake gateway only (otherwise **404**); signed URL (invalid → **403**). Persists the simulated bank status
        and feeds it through the SAME callback → `getOrderStatus` verify pipeline as a real webhook, then redirects
        (**302**) to `GET /v1/payments/return?paymentId=…`. An already-settled order just redirects (idempotent).
        `pay` → approved, `decline` → declined, `cancel` → canceled, `pending` → stays pending.
      parameters:
        - { in: path, name: reference, required: true, schema: { type: string, example: 'SH-202606-000123' } }
        - { in: path, name: action, required: true, schema: { type: string, enum: [pay, decline, cancel, pending] } }
        - { in: query, name: expires, required: true, schema: { type: integer, example: 1767225600 }, description: 'Signed-URL expiry (Unix seconds) — part of the minted link' }
        - { in: query, name: signature, required: true, schema: { type: string, example: 'SIGNATURE_HEX' }, description: 'Signed-URL HMAC — part of the minted link' }
      responses:
        '302':
          description: Redirect to the payment return page
          headers:
            Location:
              schema: { type: string, example: 'https://api.salamheyetimiz.com/v1/payments/return?paymentId=KB-FAKE-PLACEHOLDER' }
        '403': { description: Invalid or expired signature }
        '404': { description: Fake gateway inactive, unknown action, or no such test order }
        '429': { $ref: '#/components/responses/RateLimited' }

# =============================================================================
# Schemas (merged into components.schemas)
# =============================================================================
components:
  schemas:

    CursorPage:
      type: object
      properties:
        next_cursor: { type: string, nullable: true }
        has_more: { type: boolean }
        limit: { type: integer }

    # ----- Auth / Registration (unified envelope) --------------------------
    RegisterInput:
      type: object
      required: [first_name, last_name, phone, email]
      additionalProperties: false
      properties:
        first_name: { type: string, minLength: 1, maxLength: 60, example: Aysel }
        last_name: { type: string, minLength: 1, maxLength: 60, example: Məmmədova }
        phone: { type: string, pattern: '^\+994\d{9}$', example: '+994501234567' }
        email: { type: string, format: email, maxLength: 160, example: aysel@example.com }

    EmailOnlyInput:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 160, example: aysel@example.com }

    VerifyEmailInput:
      type: object
      required: [email, code, device]
      additionalProperties: false
      properties:
        email: { type: string, format: email, example: aysel@example.com }
        code: { type: string, pattern: '^\d{6}$', example: '482931' }
        device: { $ref: '#/components/schemas/DeviceFingerprintInput' }

    DeviceFingerprintInput:
      type: object
      required: [install_uuid, platform]
      properties:
        install_uuid: { type: string, format: uuid }
        platform: { type: string, enum: [ios, android] }
        os_version: { type: string, maxLength: 40, nullable: true }
        app_version: { type: string, maxLength: 20, nullable: true }
        device_model: { type: string, maxLength: 80, nullable: true }
        push_token: { type: string, maxLength: 255, nullable: true }

    OtpMeta:
      type: object
      properties:
        expires_in_seconds: { type: integer, example: 120 }
        resend_available_in_seconds: { type: integer, example: 30 }

    AuthTokensData:
      type: object
      properties:
        access_token: { type: string, description: RS256 JWT, 15-min TTL }
        refresh_token: { type: string, description: Opaque, rotating, 60-day TTL }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, example: 900 }
        refresh_expires_in: { type: integer, example: 5184000 }
        user: { $ref: '#/components/schemas/UserSelf' }

    AuthEnvelopeOtp:
      type: object
      description: Unified envelope — an OTP was dispatched (data null, timing in meta).
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Təsdiq kodu email ünvanınıza göndərildi. }
        data: { type: object, nullable: true, example: null }
        meta: { $ref: '#/components/schemas/OtpMeta' }
        errors: { type: object, nullable: true, example: null }

    AuthEnvelopeTokens:
      type: object
      description: Unified envelope — verification succeeded, tokens issued.
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Qeydiyyat tamamlandı. }
        data: { $ref: '#/components/schemas/AuthTokensData' }
        meta: { type: object, nullable: true, example: null }
        errors: { type: object, nullable: true, example: null }

    AuthEnvelopeError:
      type: object
      description: Unified envelope — failure (validation field errors, OTP code, or rate_limited).
      properties:
        success: { type: boolean, example: false }
        message: { type: string, example: Təsdiq kodu yanlışdır. }
        data: { type: object, nullable: true, example: null }
        meta: { type: object, nullable: true, example: null }
        errors:
          type: object
          additionalProperties: true
          example: { code: wrong_code }

