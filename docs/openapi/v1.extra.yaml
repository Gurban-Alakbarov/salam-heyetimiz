        active_subscriptions: { type: integer }

    AdminInvitationRow:
      type: object
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [family_member, complex_resident] }
        status: { type: string, enum: [pending, accepted, declined, expired, cancelled] }
        complex_id: { type: integer, format: int64, nullable: true }
        device_id: { type: integer, format: int64, nullable: true }
        first_name: { type: string, nullable: true }
        last_name: { type: string, nullable: true }
        email: { type: string, format: email, example: invitee@example.com }
        invited_by_admin_id: { type: integer, format: int64, nullable: true }
        invited_by_user_id: { type: integer, format: int64, nullable: true }
        send_count: { type: integer }
        expires_at: { type: string, format: date-time, nullable: true }
        accepted_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }

    RelayTestInput:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [open, close] }

    OpenCommandAdmin:
      allOf:
        - { $ref: '#/components/schemas/OpenCommand' }
        - type: object
          properties:
            direction: { type: string, enum: [open, close], nullable: true }
            source: { type: string, enum: [mobile, admin, automation, visitor] }
            command_text: { type: string, nullable: true, description: Raw command sent to the device }
            terminal_response: { type: string, nullable: true, description: Device terminal response text }

    GrantSubscriptionInput:
      type: object
      properties:
        tier: { type: string, enum: [main, additional], default: additional }
        term_days: { type: integer, minimum: 1, maximum: 3650, description: Defaults to the configured term (365) }

    AdminSubscriptionDetail:
      allOf:
        - { $ref: '#/components/schemas/Subscription' }
        - type: object
          properties:
            cancelled_at: { type: string, format: date-time, nullable: true }
            cancellation_reason: { type: string, nullable: true }
            is_legacy_comp: { type: boolean, description: 'Zero-price with no paid period (legacy complimentary)' }
            device:
              type: object
              nullable: true
              properties:
                id: { type: integer, format: int64 }
                serial: { type: string }
                location_label: { type: string, nullable: true }
                ownership_mode: { type: string, enum: [private, complex] }
                complex_id: { type: integer, format: int64, nullable: true }
            beneficiary:
              type: object
              nullable: true
              properties:
                id: { type: integer, format: int64 }
                full_name: { type: string, nullable: true }
                phone: { type: string, nullable: true, example: '+994500000000' }
            family_link_id: { type: integer, format: int64, nullable: true }
            periods:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer, format: int64 }
                  kind: { type: string, enum: [initial, renewal, extension, refund] }
                  period_start: { type: string, format: date-time, nullable: true }
                  period_end: { type: string, format: date-time, nullable: true }
                  amount_minor: { type: integer }
                  order_id: { type: integer, format: int64, nullable: true }
                  paid_by_user_id: { type: integer, format: int64, nullable: true }

    # ----- Visitor links ----------------------------------------------------
    VisitorPurpose:
      type: string
      enum: [guest, delivery, courier, service, cleaning, taxi, other]

    VisitorLinkCreate:
      type: object
      required: [access_type]
      properties:
        visitor_name: { type: string, maxLength: 120, nullable: true }
        purpose:
          description: Optional self-declared reason (reporting only)
          oneOf:
            - { $ref: '#/components/schemas/VisitorPurpose' }
            - { type: 'null' }
        access_type: { type: string, enum: [one_time, time_limited], description: 'one_time = single successful open (safety expiry); time_limited = unlimited opens within the window' }
        duration_minutes: { type: integer, minimum: 5, maximum: 720, nullable: true, description: 'Required when access_type=time_limited (max configurable, default 720)' }

    VisitorLink:
      type: object
      description: A visitor link as its creator sees it. Never includes the token.
      properties:
        id: { type: integer, format: int64 }
        visitor_name: { type: string, nullable: true }
        purpose:
          oneOf:
            - { $ref: '#/components/schemas/VisitorPurpose' }
            - { type: 'null' }
        access_type: { type: string, enum: [one_time, time_limited] }
        status: { type: string, enum: [active, used_up, expired, revoked] }
        expires_at: { type: string, format: date-time, nullable: true }
        max_usage: { type: integer, nullable: true }
        usage_count: { type: integer }
        first_used_at: { type: string, format: date-time, nullable: true, description: 'Present ONLY on GET /v1/visitor-links (key omitted elsewhere)' }
        last_used_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }

    VisitorLinkAdmin:
      allOf:
        - { $ref: '#/components/schemas/VisitorLink' }
        - type: object
          properties:
            token_prefix: { type: string, description: Non-secret prefix for identification }
            device:
              type: object
              nullable: true
              properties:
                id: { type: integer, format: int64 }
                serial: { type: string }
                label: { type: string }
            created_by:
              type: object
              properties:
                type: { type: string, enum: [admin, resident] }
                id: { type: integer, format: int64, nullable: true }
                label: { type: string, nullable: true, description: Creator email (or phone for residents) }

    VisitorLinkCreated:
      type: object
      properties:
        link: { $ref: '#/components/schemas/VisitorLink' }
        token: { type: string, description: Plaintext token — returned only once, example: 'VISITOR_LINK_TOKEN' }
        url: { type: string, format: uri, example: 'https://example.com/v/VISITOR_LINK_TOKEN' }

    VisitorLinkAdminCreated:
      type: object
      properties:
        link: { $ref: '#/components/schemas/VisitorLinkAdmin' }
        token: { type: string, description: Plaintext token — returned only once, example: 'VISITOR_LINK_TOKEN' }
        url: { type: string, format: uri, example: 'https://example.com/v/VISITOR_LINK_TOKEN' }

    VisitorLinkUsage:
      type: object
      properties:
        id: { type: integer, format: int64 }
        used_at: { type: string, format: date-time, nullable: true }
        result: { type: string, enum: [accepted, expired, revoked, usage_exceeded, device_inactive, not_found] }
        ip: { type: string, nullable: true }
        user_agent: { type: string, nullable: true }

    VisitorLinkPublicStatus:
      type: object
      description: Anonymous-safe view of a visitor link (no internal ids, no contact details).
      properties:
        barrier_name: { type: string, nullable: true }
        resident_name: { type: string, nullable: true }
        visitor_name: { type: string, nullable: true }
        purpose:
          oneOf:
            - { $ref: '#/components/schemas/VisitorPurpose' }
            - { type: 'null' }
        access_type: { type: string, enum: [one_time, time_limited], nullable: true }
        status: { type: string, enum: [active, used_up, expired, revoked, not_found] }
        valid: { type: boolean }
        reason: { type: string, enum: [expired, revoked, usage_exceeded, device_inactive, not_found], nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        coordinates:
          type: object
          nullable: true
          description: Only while the link is usable
          properties:
            lat: { type: number }
            lng: { type: number }

    VisitorOpenAccepted:
      type: object
      properties:
        command_id: { type: integer, format: int64 }
        state: { type: string, enum: [queued, dispatching, dispatched, opened, failed, expired] }
        expected_completion_ms: { type: integer }
        driver_confirms_actuation: { type: boolean }

    VisitorCommandState:
      type: object
      properties:
        command_id: { type: integer, format: int64 }
        state: { type: string, enum: [queued, dispatching, dispatched, opened, failed, expired] }

    # ----- Resident complexes (B7) ------------------------------------------
    ResidentComplex:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        address: { type: string, nullable: true }

    ComplexDeviceOffer:
      type: object
      properties:
        id: { type: integer, format: int64 }
        label: { type: string }
        address: { type: string, nullable: true }
        image_url: { type: string, nullable: true }
        subscription_price_minor: { type: integer }
        subscription_term_days: { type: integer }
        currency: { type: string, example: AZN }
        my_subscription_status: { type: string, enum: [none, pending_payment, active, expired] }

    ComplexSubscribeInput:
      type: object
      properties:
        return_url: { type: string, format: uri, maxLength: 500, nullable: true }

    OrderWithTestFlag:
      description: Order as OrderResource returns it today (adds bank_order_id, is_test, updated_at).
      allOf:
        - { $ref: '#/components/schemas/Order' }
        - type: object
          properties:
            bank_order_id: { type: string, nullable: true }
            is_test: { type: boolean, description: 'Simulated (fake-gateway) order — label it "TEST ÖDƏNİŞ"' }
            updated_at: { type: string, format: date-time, nullable: true }

    # ----- Family (B8) ------------------------------------------------------
    InviteeInput:
      type: object
      required: [first_name, last_name, email]
      properties:
        first_name: { type: string, maxLength: 60, example: Ad }
        last_name: { type: string, maxLength: 60, example: Soyad }
        email: { type: string, format: email, maxLength: 160, example: invitee@example.com }

    FamilyMemberInviteInput:
      allOf:
        - { $ref: '#/components/schemas/InviteeInput' }
        - type: object
          required: [device_id]
          properties:
            device_id: { type: integer, format: int64 }

    FamilyDeviceSubscription:
      type: object
      properties:
        id: { type: integer, format: int64 }
        status: { type: string, enum: [pending_payment, active, expired, cancelled, refunded] }
        tier: { type: string, enum: [main, additional] }
        price_minor: { type: integer }
        term_days: { type: integer }
        currency: { type: string, example: AZN }
        ends_at: { type: string, format: date-time, nullable: true }

    FamilyGrantedDevice:
      type: object
      properties:
        device_id: { type: integer, format: int64 }
        label: { type: string, nullable: true }
        subscription:
          oneOf:
            - { $ref: '#/components/schemas/FamilyDeviceSubscription' }
            - { type: 'null' }

    FamilyInvitation:
      type: object
      properties:
        id: { type: integer, format: int64 }
        device_id: { type: integer, format: int64, nullable: true }
        first_name: { type: string, nullable: true }
        last_name: { type: string, nullable: true }
        email: { type: string, format: email, example: invitee@example.com }
        status: { type: string, enum: [pending, accepted, declined, expired, cancelled] }
        expires_at: { type: string, format: date-time, nullable: true }
        send_count: { type: integer }

    FamilyInviteResultResponse:
      type: object
      properties:
        data:
          oneOf:
            - type: object
              description: Existing family member — device granted directly
              properties:
                granted: { type: boolean, enum: [true] }
                device: { $ref: '#/components/schemas/FamilyGrantedDevice' }
            - type: object
              description: Invitation emailed
              properties:
                granted: { type: boolean, enum: [false] }
                invitation: { $ref: '#/components/schemas/FamilyInvitation' }

    FamilyMember:
      type: object
      properties:
        family_link_id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        full_name: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true, example: member@example.com }
        phone_masked: { type: string, nullable: true }
        linked_at: { type: string, format: date-time, nullable: true }
        devices: { type: array, items: { $ref: '#/components/schemas/FamilyGrantedDevice' } }

    FamilySubscriptionRow:
      allOf:
        - type: object
          properties:
            member:
              type: object
              properties:
                user_id: { type: integer, format: int64 }
                full_name: { type: string, nullable: true }
        - { $ref: '#/components/schemas/FamilyGrantedDevice' }

    AccessRemovalResult:
      type: object
      properties:
        revoked_rows: { type: integer, description: Roster rows revoked }
        cancelled_subscriptions: { type: integer, description: Subscriptions cancelled (no refund) }

    # ----- Invitations (B6, unified envelope) -------------------------------
    InvitePublicView:
      type: object
      description: What the invitee may see before signing in — no ids, email masked.
      properties:
        kind: { type: string, enum: [family_member, complex_resident] }
        complex_name: { type: string, nullable: true }
        inviter_name: { type: string, nullable: true, description: Complex name (complex_resident) or the inviting head's name (family_member) }
        first_name: { type: string, nullable: true }
        last_name: { type: string, nullable: true }
        email_masked: { type: string, example: 'i******@example.com' }
        status: { type: string, enum: [pending] }
        expires_at: { type: string, format: date-time }

    InviteLookupEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Dəvət etibarlıdır. }
        data: { $ref: '#/components/schemas/InvitePublicView' }
        meta: { type: object, nullable: true, example: null }
        errors: { type: object, nullable: true, example: null }

    InviteAcceptEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Dəvət qəbul edildi. }
        data:
          oneOf:
            - type: object
              description: complex_resident — joined the complex
              properties:
                kind: { type: string, enum: [complex_resident] }
                complex:
                  type: object
                  properties:
                    id: { type: integer, format: int64 }
                    name: { type: string }
            - type: object
              description: family_member — family link + device access + pending subscription
              properties:
                kind: { type: string, enum: [family_member] }
                family_link_id: { type: integer, format: int64 }
                device:
                  type: object
                  properties:
                    id: { type: integer, format: int64 }
                    label: { type: string, nullable: true }
                subscription_id: { type: integer, format: int64 }
        meta: { type: object, nullable: true, example: null }
        errors: { type: object, nullable: true, example: null }

    InviteDeclineEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Dəvət rədd edildi. }
        data: { type: object, nullable: true, example: null }
        meta: { type: object, nullable: true, example: null }
        errors: { type: object, nullable: true, example: null }

    # ----- Komendant (B5) ---------------------------------------------------
    KomendantComplex:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        address: { type: string, nullable: true }
        stats:
          type: object
          properties:
            devices: { type: integer }
            residents: { type: integer }
            pending_invitations: { type: integer }

    KomendantDevice:
      type: object
      properties:
        id: { type: integer, format: int64 }
        label: { type: string }
        address: { type: string, nullable: true }
        status: { type: string, enum: [unassigned, active, suspended, disabled, decommissioned] }
        online: { type: boolean }
        image_url: { type: string, nullable: true }
        subscription_price_minor: { type: integer }
        subscription_term_days: { type: integer }
        currency: { type: string, example: AZN }

    KomendantResident:
      type: object
      properties:
        user_id: { type: integer, format: int64 }
        full_name: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true, example: resident@example.com }
        phone_masked: { type: string, nullable: true }
        joined_at: { type: string, format: date-time, nullable: true }
        active_subscriptions: { type: integer }

    KomendantInvitation:
      type: object
      properties:
        id: { type: integer, format: int64 }
        first_name: { type: string, nullable: true }
        last_name: { type: string, nullable: true }
        email: { type: string, format: email, example: invitee@example.com }
        status: { type: string, enum: [pending, accepted, declined, expired, cancelled] }
        expires_at: { type: string, format: date-time, nullable: true }
        send_count: { type: integer }
        last_sent_at: { type: string, format: date-time, nullable: true }
        accepted_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
